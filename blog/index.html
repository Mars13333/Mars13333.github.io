</div></div></div></template><template><div class="vp-post-item has-cover left" data-allow-mismatch data-v-2d444f89 data-v-25ddbb7a><div data-allow-mismatch class="post-cover" style="width:240px;height:135px;" data-v-25ddbb7a><a class="vp-link link" href="/article/rofu2eoq/" data-v-25ddbb7a><!--[--><img src="/images/blog/readtao-series/readtao-series-cover.png" alt="Studio 改了内容，Reader 为什么不会立即变化：ReadTao 的不可变发布设计" loading="lazy" data-v-25ddbb7a><!--]--><!--[--><!--]--><!----></a></div><div class="post-item-content" data-v-25ddbb7a><h3 data-v-25ddbb7a><!----><!----><!----><a class="vp-link link" href="/article/rofu2eoq/" data-v-25ddbb7a><!--[-->Studio 改了内容，Reader 为什么不会立即变化：ReadTao 的不可变发布设计<!--]--><!--[--><!--]--><!----></a></h3><div class="post-meta" data-v-25ddbb7a><!----><div class="reading-time" data-v-25ddbb7a><span class="vpi-books icon" data-v-25ddbb7a></span><span data-v-25ddbb7a>约 2531 字</span><span data-v-25ddbb7a>8 分钟</span></div><div class="tag-list" data-v-25ddbb7a><span class="icon vpi-tag" data-v-25ddbb7a></span><!--[--><a class="vp-link link tag vp-tag-cpp5" href="/article/tags/?tag=ReadTao" data-v-25ddbb7a><!--[-->ReadTao<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-b0oc" href="/article/tags/?tag=FastAPI" data-v-25ddbb7a><!--[-->FastAPI<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-2zzt" href="/article/tags/?tag=PostgreSQL" data-v-25ddbb7a><!--[-->PostgreSQL<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-2zzt" href="/article/tags/?tag=OpenAPI" data-v-25ddbb7a><!--[-->OpenAPI<!--]--><!--[--><!--]--><!----></a><!--]--></div><div class="create-time" data-v-25ddbb7a><span class="icon vpi-clock" data-v-25ddbb7a></span><span data-v-25ddbb7a>2026-07-11</span></div></div><div class="vp-doc excerpt" data-v-25ddbb7a><p>内容管理端保存成功，不应该等于线上内容立即被改写。ReadTao 在修订表和 Reader 之间增加了完整底本级的不可变 Release：发布事务固定每个段落采用的原文、拼音、译文和来源注文，再一次性切换当前版本指针。</p>
</div></div></div></template><template><div class="vp-post-item has-cover left" data-allow-mismatch data-v-2d444f89 data-v-25ddbb7a><div data-allow-mismatch class="post-cover" style="width:240px;height:135px;" data-v-25ddbb7a><a class="vp-link link" href="/article/3gag21o4/" data-v-25ddbb7a><!--[--><img src="/images/blog/readtao-series/readtao-series-cover.png" alt="AI 只能写初稿：ReadTao 的内容生成、人工审校与失败重试" loading="lazy" data-v-25ddbb7a><!--]--><!--[--><!--]--><!----></a></div><div class="post-item-content" data-v-25ddbb7a><h3 data-v-25ddbb7a><!----><!----><!----><a class="vp-link link" href="/article/3gag21o4/" data-v-25ddbb7a><!--[-->AI 只能写初稿：ReadTao 的内容生成、人工审校与失败重试<!--]--><!--[--><!--]--><!----></a></h3><div class="post-meta" data-v-25ddbb7a><!----><div class="reading-time" data-v-25ddbb7a><span class="vpi-books icon" data-v-25ddbb7a></span><span data-v-25ddbb7a>约 3072 字</span><span data-v-25ddbb7a>10 分钟</span></div><div class="tag-list" data-v-25ddbb7a><span class="icon vpi-tag" data-v-25ddbb7a></span><!--[--><a class="vp-link link tag vp-tag-cpp5" href="/article/tags/?tag=ReadTao" data-v-25ddbb7a><!--[-->ReadTao<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-v2k5" href="/article/tags/?tag=AI" data-v-25ddbb7a><!--[-->AI<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-4cab" href="/article/tags/?tag=Dramatiq" data-v-25ddbb7a><!--[-->Dramatiq<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-8p2t" href="/article/tags/?tag=内容工作流" data-v-25ddbb7a><!--[-->内容工作流<!--]--><!--[--><!--]--><!----></a><!--]--></div><div class="create-time" data-v-25ddbb7a><span class="icon vpi-clock" data-v-25ddbb7a></span><span data-v-25ddbb7a>2026-07-05</span></div></div><div class="vp-doc excerpt" data-v-25ddbb7a><p>把古籍正文交给模型生成现代汉语、英文或拼音建议并不难，难的是模型超时、部分失败、原文后来修改时，系统还能不能保持状态可信。这篇记录 ReadTao 如何把生成任务限制在“机器初稿”，再通过输入版本、修订关系、人工审校和可重试任务形成可靠工作流。</p>
</div></div></div></template><template><div class="vp-post-item has-cover left" data-allow-mismatch data-v-2d444f89 data-v-25ddbb7a><div data-allow-mismatch class="post-cover" style="width:240px;height:135px;" data-v-25ddbb7a><a class="vp-link link" href="/article/ccd5ldhz/" data-v-25ddbb7a><!--[--><img src="/images/blog/readtao-series/readtao-series-cover.png" alt="古籍不是上传一个 TXT 就结束了：ReadTao Content Studio 的导入与分段设计" loading="lazy" data-v-25ddbb7a><!--]--><!--[--><!--]--><!----></a></div><div class="post-item-content" data-v-25ddbb7a><h3 data-v-25ddbb7a><!----><!----><!----><a class="vp-link link" href="/article/ccd5ldhz/" data-v-25ddbb7a><!--[-->古籍不是上传一个 TXT 就结束了：ReadTao Content Studio 的导入与分段设计<!--]--><!--[--><!--]--><!----></a></h3><div class="post-meta" data-v-25ddbb7a><!----><div class="reading-time" data-v-25ddbb7a><span class="vpi-books icon" data-v-25ddbb7a></span><span data-v-25ddbb7a>约 3282 字</span><span data-v-25ddbb7a>11 分钟</span></div><div class="tag-list" data-v-25ddbb7a><span class="icon vpi-tag" data-v-25ddbb7a></span><!--[--><a class="vp-link link tag vp-tag-cpp5" href="/article/tags/?tag=ReadTao" data-v-25ddbb7a><!--[-->ReadTao<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-03k4" href="/article/tags/?tag=Content Studio" data-v-25ddbb7a><!--[-->Content Studio<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-rlg6" href="/article/tags/?tag=数据建模" data-v-25ddbb7a><!--[-->数据建模<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-f1nl" href="/article/tags/?tag=文本处理" data-v-25ddbb7a><!--[-->文本处理<!--]--><!--[--><!--]--><!----></a><!--]--></div><div class="create-time" data-v-25ddbb7a><span class="icon vpi-clock" data-v-25ddbb7a></span><span data-v-25ddbb7a>2026-06-26</span></div></div><div class="vp-doc excerpt" data-v-25ddbb7a><p>古籍整理最容易被低估的部分，是把“文件里有文字”变成“每个公开段落都能回到具体来源”。这篇沿着 ReadTao Content Studio 的真实导入链路，拆解来源登记、原文件保存、正文与注文分层、语义分段和稳定段落身份。</p>
</div></div></div></template><template><div class="vp-post-item has-cover left" data-allow-mismatch data-v-2d444f89 data-v-25ddbb7a><div data-allow-mismatch class="post-cover" style="width:240px;height:135px;" data-v-25ddbb7a><a class="vp-link link" href="/article/09ldfjxx/" data-v-25ddbb7a><!--[--><img src="/images/blog/readtao-series/readtao-series-cover.png" alt="我为什么把古籍网站拆成 Studio 和 Reader：ReadTao 的整体架构" loading="lazy" data-v-25ddbb7a><!--]--><!--[--><!--]--><!----></a></div><div class="post-item-content" data-v-25ddbb7a><h3 data-v-25ddbb7a><!----><!----><!----><a class="vp-link link" href="/article/09ldfjxx/" data-v-25ddbb7a><!--[-->我为什么把古籍网站拆成 Studio 和 Reader：ReadTao 的整体架构<!--]--><!--[--><!--]--><!----></a></h3><div class="post-meta" data-v-25ddbb7a><!----><div class="reading-time" data-v-25ddbb7a><span class="vpi-books icon" data-v-25ddbb7a></span><span data-v-25ddbb7a>约 2537 字</span><span data-v-25ddbb7a>8 分钟</span></div><div class="tag-list" data-v-25ddbb7a><span class="icon vpi-tag" data-v-25ddbb7a></span><!--[--><a class="vp-link link tag vp-tag-cpp5" href="/article/tags/?tag=ReadTao" data-v-25ddbb7a><!--[-->ReadTao<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-aw5b" href="/article/tags/?tag=Vue" data-v-25ddbb7a><!--[-->Vue<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-b0oc" href="/article/tags/?tag=FastAPI" data-v-25ddbb7a><!--[-->FastAPI<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-kbyj" href="/article/tags/?tag=系统架构" data-v-25ddbb7a><!--[-->系统架构<!--]--><!--[--><!--]--><!----></a><!--]--></div><div class="create-time" data-v-25ddbb7a><span class="icon vpi-clock" data-v-25ddbb7a></span><span data-v-25ddbb7a>2026-06-24</span></div></div><div class="vp-doc excerpt" data-v-25ddbb7a><p>ReadTao 不是把几份古籍 TXT 放到网页上展示，而是把来源、整理、审校、发布和阅读拆成一条可以长期维护的数据链。这篇先从整体架构出发，记录我为什么把项目分成 Content Studio、Reader、Backend 和 Worker，以及这些模块之间最重要的边界。</p>
</div></div></div></template><template><div class="vp-post-item has-cover left" data-allow-mismatch data-v-2d444f89 data-v-25ddbb7a><div data-allow-mismatch class="post-cover" style="width:240px;height:135px;" data-v-25ddbb7a><a class="vp-link link" href="/article/c476htv1/" data-v-25ddbb7a><!--[--><img src="/images/yi/yi3.png" alt="易学如何长成（下）：从魏晋义理到清代考据与现代术数" loading="lazy" data-v-25ddbb7a><!--]--><!--[--><!--]--><!----></a></div><div class="post-item-content" data-v-25ddbb7a><h3 data-v-25ddbb7a><!----><!----><!----><a class="vp-link link" href="/article/c476htv1/" data-v-25ddbb7a><!--[-->易学如何长成（下）：从魏晋义理到清代考据与现代术数<!--]--><!--[--><!--]--><!----></a></h3><div class="post-meta" data-v-25ddbb7a><!----><div class="reading-time" data-v-25ddbb7a><span class="vpi-books icon" data-v-25ddbb7a></span><span data-v-25ddbb7a>约 6797 字</span><span data-v-25ddbb7a>23 分钟</span></div><div class="tag-list" data-v-25ddbb7a><span class="icon vpi-tag" data-v-25ddbb7a></span><!--[--><a class="vp-link link tag vp-tag-dt1g" href="/article/tags/?tag=易学" data-v-25ddbb7a><!--[-->易学<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-aw5b" href="/article/tags/?tag=中国思想史" data-v-25ddbb7a><!--[-->中国思想史<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-03k4" href="/article/tags/?tag=术数史" data-v-25ddbb7a><!--[-->术数史<!--]--><!--[--><!--]--><!----></a><a class="vp-link link tag vp-tag-8p2t" href="/article/tags/?tag=历史" data-v-25ddbb7a><!--[-->历史<!--]--><!--[--><!--]--><!----></a><!--]--></div><div class="create-time" data-v-25ddbb7a><span class="icon vpi-clock" data-v-25ddbb7a></span><span data-v-25ddbb7a>2025-12-20</span></div></div><div class="vp-doc excerpt" data-v-25ddbb7a><p>汉代把卦象、阴阳、五行、历法和政治连接成庞大体系，后世却没有沿着一条路线继续加法。魏晋转向义理，宋代重新建构宇宙与人心，清人又回头审查宋易；与此同时，六爻、命理和紫微斗数也在另一条线上逐渐定型。</p>
